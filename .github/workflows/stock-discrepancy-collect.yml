name: stock-discrepancy-collect

# Hourly collector for the Base B20 vs Hyperliquid HIP-3 stock weekend
# discrepancy experiment (Daily Alpha brief, 2026-10-07/08). Separate from
# ci.yml (that one only compile-checks on push) and from any future Bazaar
# settlement-keepalive workflow - merge them into one file later if that
# makes maintenance simpler, but keep this one standalone until the
# keepalive cron actually exists.
#
# Runs scripts/collect_stock_discrepancy.py and commits whatever it appended
# to data-public/*.jsonl straight back to main. Deliberately NOT data/ -
# that directory is gitignored (HIP-4 webhook secrets live there, see
# app/events.py) and silently refuses new files. No secrets needed here -
# this job only reads public market data, it never signs or sends a payment.

on:
  schedule:
    # :13 past the hour, not :00, to avoid piling onto the exact top of
    # the hour with everyone else's cron jobs.
    - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Run collector
        run: python scripts/collect_stock_discrepancy.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-public/stock_discrepancy_log.jsonl data-public/kalshi_btc15m_log.jsonl
          git diff --cached --quiet && echo "no changes to commit" && exit 0
          git commit -m "data: hourly stock discrepancy + kalshi snapshot"
          git push
